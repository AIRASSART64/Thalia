security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_PROGRAMMATEUR: ROLE_USER
        ROLE_TECHNICIEN:    ROLE_USER
        ROLE_FINANCIER:     ROLE_USER
        ROLE_ADMIN:         [ROLE_PROGRAMMATEUR, ROLE_TECHNICIEN, ROLE_FINANCIER]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # 1. Firewall pour l'obtention du token JWT
        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # 2. Firewall pour sécuriser les routes de votre API
        api:
            pattern:   ^/api
            stateless: true
            jwt: ~

        # 3. Firewall pour votre application Web classique
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker 
            custom_authenticator: App\Security\AppAuthenticator
            logout:
                path: app_logout
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    # Contrôle des accès
    access_control:
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/$, roles: PUBLIC_ACCESS }              
        - { path: ^/login$, roles: PUBLIC_ACCESS }         
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/profile, roles: ROLE_USER }   
        - { path: ^/superadmin, roles: ROLE_SUPER_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10